<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Movie</title>
</head>
<body>

    <form action="/update-movie" method="POST">

        <div class="input-field">
            <h2>Edit Movie</h2>
            <input type="hidden" name="movie_id" value="{{ movie[0] }}">
            <input type="text" name="title" value="{{ movie[1] }}" placeholder="Title">
            <input type="text" name="genre" value="{{ movie[2] }}" placeholder="Genre">
            <button type="submit">Save</button>
        </div>
    </form>

    <a href="/movies">Cancel</a>

</body>
</html>
